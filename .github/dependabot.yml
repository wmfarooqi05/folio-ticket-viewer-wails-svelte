# Ticket 19: update proposals for the npm lockfile and the pinned GitHub Actions. Weekly, grouped so a
# week is one PR per ecosystem. The frozen Go module (RETIRED.md) is left out on purpose.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # the versions are exact pins (package.json) and the lockfile is committed: keep it that way
    versioning-strategy: increase
    # `typescript` stays on 6.x: svelte-check 4.7.8 needs TypeScript's JavaScript API, which 7.x does not
    # ship. TypeScript 7 is installed as `typescript-7` and `npm run check` runs its tsc as well. Remove
    # this ignore once svelte-check accepts TypeScript 7 (its peer range says ^5 || ^6 today).
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
