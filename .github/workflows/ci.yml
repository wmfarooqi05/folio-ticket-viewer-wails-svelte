# Ticket 17: tests, a reproducible build, the npm package, and a release on a v* tag.
# Ticket 26: Node only. The Go desktop app is retired and frozen (RETIRED.md), so nothing here installs
# or runs Go, wails3 or task, and the release is the folio-issues-kanban-viewer tarball alone.
# Every action is pinned by full commit SHA (the version is in the comment). To update one,
# look the tag up with `gh api repos/<owner>/<repo>/commits/<tag> -q .sha`.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '26.13.1'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: tests and static checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Frontend dependencies (npm ci)
        working-directory: frontend
        run: npm ci --ignore-scripts
      # frontend/bindings is generated by wails3 (Go) and svelte-check needs its types. This copies the
      # frozen snapshot, so no Go is needed.
      - name: Restore the type-only Wails bindings
        run: node scripts/restore-bindings.mjs
      - name: svelte-check (TypeScript 6) and tsc (TypeScript 7)
        working-directory: frontend
        run: npm run check
      - name: vitest
        working-directory: frontend
        run: npm test
      # Node server only. The frozen Go side runs only with FOLIO_CONTRACT_GO=1 and is not in CI.
      - name: Contract tests (Node server)
        working-directory: frontend
        run: npm run test:contract
      - name: Size-check self-test
        run: node --test scripts/size-check.test.mjs

  audit:
    name: npm audit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Everything the package ships (svelte, mermaid, markdown-it and so on) is bundled from the
      # frontend's devDependencies, so `--omit=dev` would gate nothing that ships. The gate is every
      # dependency at high or critical; low and moderate advisories are printed and never fail it.
      - name: All dependencies (fails at high)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: All dependencies (full report)
        working-directory: frontend
        continue-on-error: true
        run: npm audit

  # The build jobs get no signing permissions: they run every build dependency, including on
  # pull requests and manual runs. Signing happens in the separate `attest` job below.
  npm-package:
    name: folio-issues-kanban-viewer package
    needs: [checks, audit]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # What `task build` does, without needing task: npm ci, the web build, then the size budgets.
      - name: Frontend dependencies (npm ci)
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build the package
        working-directory: frontend
        run: npm run build:web
      - name: Size budgets
        run: node scripts/size-check.mjs
      - name: npm pack
        working-directory: packages/folio-issues-kanban-viewer
        run: |
          npm pack --ignore-scripts
          sha256sum folio-issues-kanban-viewer-*.tgz | tee SHA256SUMS-npm
          # list to a file first: `tar | head` makes tar exit with SIGPIPE (141) under pipefail
          tar -tzf folio-issues-kanban-viewer-*.tgz > "$RUNNER_TEMP/tarball-files.txt"
          head -40 "$RUNNER_TEMP/tarball-files.txt"
          echo "($(wc -l < "$RUNNER_TEMP/tarball-files.txt") files)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-issues-kanban-viewer-npm
          path: |
            packages/folio-issues-kanban-viewer/folio-issues-kanban-viewer-*.tgz
            packages/folio-issues-kanban-viewer/SHA256SUMS-npm
          if-no-files-found: error

  # Signed build provenance. Only for a v* tag on a public repo: attestations on a private repo
  # need GitHub Enterprise Cloud. It signs the tarball the build job uploaded, after checking it
  # against its checksum file, and runs no build tools of its own.
  attest:
    name: attest build provenance
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    needs: [npm-package]
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      - name: Check the files against their checksums
        working-directory: files
        run: sha256sum -c SHA256SUMS-npm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: files/folio-issues-kanban-viewer-*.tgz
      # The same signed provenance as a file, attached to the Release by the job below. Anyone can then
      # check the tarball offline (`gh attestation verify <tgz> --bundle <this file> --repo ...`), and
      # OpenSSF Scorecard's Signed-Releases check finds it (ticket 29).
      - name: Provenance bundle as a file
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p provenance
          name="$(basename files/folio-issues-kanban-viewer-*.tgz .tgz)"
          jq -c . "$BUNDLE" > "provenance/$name.intoto.jsonl"
          ls -l provenance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-issues-kanban-viewer-provenance
          path: provenance/*.intoto.jsonl
          if-no-files-found: error

  release:
    name: GitHub Release
    # waits for `attest` so its provenance file goes into the Release; `attest` is skipped on a private
    # repo, and then the Release is made without it
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.npm-package.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    needs: [npm-package, attest]
    runs-on: windows-2025
    permissions:
      contents: write      # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true
      - name: The tag must match the package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./packages/folio-issues-kanban-viewer/package.json').version")"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but package.json says $have"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ls -l release-files
          gh release create "$GITHUB_REF_NAME" release-files/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            --notes "Built by CI run $RUN_URL (commit $GITHUB_SHA). Verify the files as the README describes."
