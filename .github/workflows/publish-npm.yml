# Ticket 17: publishing folio-issues-kanban-viewer to npm. Manual only: run this workflow by hand from a v* tag.
# It publishes the tarball that ci.yml built and checksummed for that exact commit, using npm
# trusted publishing (OIDC, no token anywhere; provenance is added automatically).
#
# Setup order (ticket 27; checked against docs.npmjs.com on Nov 20, 2026):
#   - Version 0.1.0 is published BY HAND (`npm publish ./folio-issues-kanban-viewer-0.1.0.tgz` after `npm login`), not by
#     this workflow. npm only lets you add a trusted publisher to a package that already exists
#     (https://docs.npmjs.com/cli/v11/commands/npm-trust: "The package you're configuring must already exist
#     on the npm registry"). This workflow is for 0.1.1 and later.
#   - Before 0.1.1, in this order:
#       1. The repo is public (npm provenance needs that).
#       2. Repo Settings > Environments > `npm-publish`: add yourself as a required reviewer, and
#          restrict deployment branches and tags to `v*` tags.
#       3. npmjs.com > folio-issues-kanban-viewer > Settings > Trusted publisher > GitHub Actions: this repo, workflow
#          filename `publish-npm.yml`, environment `npm-publish`, and TICK "npm publish". Trusted publishers
#          created after Sep 03, 2026 allow only `npm stage publish` by default, and this workflow runs
#          `npm publish` (https://docs.npmjs.com/trusted-publishers).
#       4. Run this workflow from the v0.1.1 tag within 2 days: a trusted publisher whose first publish
#          has not completed in 2 days expires (same page). So add it right before the release.
name: publish-npm

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'   # npm 11.5.1 or newer is needed for trusted publishing; Node 26 ships newer

jobs:
  publish:
    name: npm publish
    runs-on: windows-2025
    environment: npm-publish
    permissions:
      contents: read
      actions: read        # download the artifact from the ci.yml run
      attestations: read   # gh attestation verify
      id-token: write      # trusted publishing (OIDC)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only a v* tag whose commit is on main
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this workflow from a v* tag, not $GITHUB_REF."; exit 1 ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main."; exit 1
          fi
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./packages/folio-issues-kanban-viewer/package.json').version")"
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $have"; exit 1; }
      - name: Find the successful ci.yml run for this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --event push --json databaseId,headBranch --jq "[.[] | select(.headBranch == \"$GITHUB_REF_NAME\")][0].databaseId")"
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::No successful ci.yml run for tag $GITHUB_REF_NAME at $GITHUB_SHA."; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Using ci.yml run $id"
      - name: Download the tarball from that run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: gh run download "$RUN_ID" --name folio-issues-kanban-viewer-npm --dir npm-files
      - name: Check the checksum and the attestation
        working-directory: npm-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS-npm
          gh attestation verify folio-issues-kanban-viewer-*.tgz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref "$GITHUB_REF"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Publish (trusted publishing, no token)
        working-directory: npm-files
        run: |
          npm --version
          # a relative path needs the ./ prefix (https://docs.npmjs.com/cli/v11/commands/npm-publish)
          npm publish ./folio-issues-kanban-viewer-*.tgz
