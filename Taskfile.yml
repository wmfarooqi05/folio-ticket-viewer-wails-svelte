version: '3'

# Folio is Windows-only (Wails v3, WebView2). Build files live in build/.

vars:
  APP_NAME: "folio"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # `task build PRODUCTION=true` is the default; `task build DEV=true` makes a debug build.
  DEV: '{{.DEV | default "false"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  dev:
    summary: Runs the app in development mode (Vite hot reload, Go rebuild on change)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:
    summary: Builds the production exe into bin/ (regenerates the TS bindings first), then checks the size budgets
    cmds:
      - task: windows:build
        vars:
          DEV: '{{.DEV}}'
      - cmd: node scripts/size-check.mjs
        platforms: [windows]
        # a DEV=true build is unminified, so the budgets mean nothing there
        if: '[ "{{.DEV}}" != "true" ]'

  size:
    summary: Checks the size budgets against the last build (frontend/dist, bin/folio.exe)
    cmds:
      - node scripts/size-check.mjs
      - node --test scripts/size-check.test.mjs

  ram:
    summary: RAM and CPU benchmark of bin/folio.exe on the fixtures (about 25 minutes; see README)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ram-check.ps1 {{.CLI_ARGS}}

  run:
    summary: Runs the built exe (set FOLIO_ROOT to skip the folder picker)
    cmds:
      - task: windows:run

  package:
    summary: Builds an NSIS installer (needs NSIS on PATH)
    cmds:
      - task: windows:package

  test:
    summary: Runs the Go tests and the frontend tests
    deps: [dist:stub, common:install:frontend:deps]
    cmds:
      - go test ./...
      - task: test:frontend

  test:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm test

  build:lib:
    summary: Builds the parser alone into frontend/dist-lib/lib.mjs (zero imports, for the upstream CLI)
    dir: frontend
    deps: [common:install:frontend:deps]
    cmds:
      - npm run build:lib

  check:
    summary: go vet plus svelte-check (regenerates the TS bindings first)
    deps: [dist:stub, common:install:frontend:deps]
    cmds:
      - go vet ./...
      - wails3 generate bindings -clean=true -ts -i
      - task: check:frontend

  check:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run check

  dist:stub:
    summary: Makes sure frontend/dist exists, because main.go embeds it (go vet fails without it)
    internal: true
    status:
      - test -d frontend/dist
    cmds:
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force frontend/dist | Out-Null; Set-Content -Path frontend/dist/.gitkeep -Value ''"
        platforms: [windows]
